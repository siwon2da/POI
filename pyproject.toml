[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "poi-lang"
version = "1.10.0"
description = "POI - Power Of Imagination. 우리가 만든 언어."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
poi = "poi.cli:main"

[tool.setuptools]
packages = ["poi", "poi.runtime"]
