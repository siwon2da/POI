<!doctype html><html lang=ko><head>
<meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>{{ 제목 }} · POI</title>
<style>
  :root{
    --bg:#0c0e13; --panel:#12151c; --panel2:#171b24; --line:#232833;
    --ink:#e6e9ef; --ink2:#9aa3b2; --ink3:#69707e;
    --accent:#5b9dff; --accent2:#8b7dff; --ok:#37d39b; --warn:#ffb454;
    --mono:"SFMono-Regular",ui-monospace,"JetBrains Mono","Cascadia Code",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",Segoe UI,sans-serif;
  }
  @media (prefers-color-scheme:light){
    :root{--bg:#f7f8fa;--panel:#fff;--panel2:#f0f2f5;--line:#e4e7ec;
      --ink:#151a22;--ink2:#5a6270;--ink3:#8b93a0;--accent:#2f6fed;--accent2:#6a5bff;}
  }
  *{box-sizing:border-box;margin:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.65;
    word-break:keep-all;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  code,kbd,pre{font-family:var(--mono);font-size:.92em}
  .wrap{max-width:940px;margin:0 auto;padding:0 22px}
  nav{position:sticky;top:0;z-index:9;backdrop-filter:blur(10px);
    background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;gap:18px;height:58px}
  nav .brand{font-family:var(--mono);font-weight:700;letter-spacing:-.02em;font-size:1.05rem}
  nav .brand b{color:var(--accent)}
  nav .sp{flex:1}
  nav a{color:var(--ink2);font-size:.92rem}
  nav a:hover{color:var(--ink);text-decoration:none}
  .btn{display:inline-block;background:var(--accent);color:#fff;border:0;border-radius:11px;
    padding:11px 18px;font:inherit;font-weight:650;cursor:pointer;transition:transform .1s,filter .15s}
  .btn:hover{filter:brightness(1.08);text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
  .muted{color:var(--ink2)}
  .tag{font-family:var(--mono);font-size:.78rem;color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);
    padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
  pre{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;
    overflow:auto;line-height:1.55}
  footer{border-top:1px solid var(--line);margin-top:64px;padding:28px 0;color:var(--ink3);font-size:.86rem}
  h1{font-size:clamp(2rem,6vw,3.1rem);line-height:1.1;letter-spacing:-.03em}
  h2{font-size:1.5rem;letter-spacing:-.02em;margin-bottom:12px}
  .grid{display:grid;gap:16px}
  @media(min-width:720px){.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}}
</style></head><body>
<nav><div class=wrap>
  <span class=brand><b>POI</b> Power Of Imagination</span>
  <span class=sp></span>
  <a href="/">홈</a><a href="/play">플레이그라운드</a><a href="/dashboard">대시보드</a>
  <a href="https://hagora.kr/poi/" target=_blank>문서</a>
</div></nav>
<main class=wrap style="padding-top:40px">
